services:
  exporter:
    build:
      context: ./exporter
    environment:
      WROOM_BASE_URL: ${WROOM_BASE_URL:-http://192.168.2.153}
      EXPORTER_PORT: 9108
      SCAN_INTERVAL_SECONDS: ${SCAN_INTERVAL_SECONDS:-60}
      ERROR_RETRY_INTERVAL_SECONDS: ${ERROR_RETRY_INTERVAL_SECONDS:-15}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-1}
      SCAN_TIMEOUT_SECONDS: ${SCAN_TIMEOUT_SECONDS:-30}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-5}
      SCAN_ON_COLLECT: ${SCAN_ON_COLLECT:-true}
      EXPECTED_CHILD_COUNT: ${EXPECTED_CHILD_COUNT:-7}
      DEVICE_MAP_PATH: /config/device-map.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./config/device-map.json:/config/device-map.json:ro
    ports:
      - "9108:9108"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: system
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
